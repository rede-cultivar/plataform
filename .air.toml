
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/cultivar ./cmd/cultivar"
bin = "./tmp/cultivar"
args_bin = ["serve"]

include_ext = ["go", "html", "tmpl", "css", "js"]
exclude_dir = ["tmp", "vendor", ".git"]
delay = 1000
stop_on_error = true
send_interrupt = true

[misc]
clean_on_exit = true
