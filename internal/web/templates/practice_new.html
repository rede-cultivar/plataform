{{define "content"}}
<section class="panel panel-wide">
  <h1>Nova prática</h1>
  <p class="muted">
    Descreva uma prática reproduzível, com materiais, etapas, riscos e
    adaptações. Rascunhos ficam visíveis apenas para você.
  </p>

  <form method="post" action="/praticas" class="stack">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

    <label>
      Título
      <input type="text" name="title" value="{{.FormPractice.Title}}" maxlength="160" required>
    </label>

    <label>
      Resumo
      <textarea name="summary" rows="3" maxlength="500">{{.FormPractice.Summary}}</textarea>
    </label>

    <label>
      Categoria
      <input type="text" name="category" value="{{.FormPractice.Category}}" maxlength="80" placeholder="ex.: adubação, recipientes, substrato">
    </label>

    <label>
      Dificuldade
      <select name="difficulty">
        <option value="beginner" {{if eq (printf "%s" .FormPractice.Difficulty) "beginner"}}selected{{end}}>Iniciante</option>
        <option value="intermediate" {{if eq (printf "%s" .FormPractice.Difficulty) "intermediate"}}selected{{end}}>Intermediário</option>
        <option value="advanced" {{if eq (printf "%s" .FormPractice.Difficulty) "advanced"}}selected{{end}}>Avançado</option>
      </select>
    </label>

    <label>
      Tempo estimado
      <input type="text" name="time_estimate" value="{{.FormPractice.TimeEstimate}}" maxlength="80" placeholder="ex.: 30 minutos, 2 semanas">
    </label>

    <label>
      Custo aproximado
      <input type="text" name="cost_estimate" value="{{.FormPractice.CostEstimate}}" maxlength="80" placeholder="ex.: baixo, R$ 20">
    </label>

    <label>
      Materiais e ferramentas
      <textarea name="materials" rows="6">{{.MaterialsText}}</textarea>
      <span class="hint">Um item por linha.</span>
    </label>

    <label>
      Passo a passo
      <textarea name="steps" rows="8">{{.StepsText}}</textarea>
      <span class="hint">Uma etapa por linha. A ordem das linhas será preservada.</span>
    </label>

    <label>
      Avisos de segurança e riscos
      <textarea name="safety" rows="4" maxlength="2000">{{.FormPractice.Safety}}</textarea>
      <span class="hint">Informe riscos à saúde, à segurança ou ao meio ambiente.</span>
    </label>

    <label>
      Adaptações e variações
      <textarea name="adaptations" rows="4" maxlength="2000">{{.FormPractice.Adaptations}}</textarea>
    </label>

    <label>
      Referências
      <textarea name="references" rows="3" maxlength="2000">{{.FormPractice.References}}</textarea>
    </label>

    <label>
      Licença
      <input type="text" name="license" value="{{.FormPractice.License}}" maxlength="120" placeholder="ex.: CC BY-SA 4.0">
      <span class="hint">A licença é obrigatória para publicar. Rascunhos podem ficar sem licença.</span>
    </label>

    <div class="actions">
      <button type="submit" name="action" value="save">Salvar rascunho</button>
      <button type="submit" name="action" value="publish" class="button-secondary">Publicar</button>
      <a class="button button-secondary" href="/praticas/minhas">Cancelar</a>
    </div>
  </form>
</section>
{{end}}
